[project]
name = "bca-engine"
version = "0.1.0"
description = "Bulk call analysis engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23.0",
    "google-cloud-bigquery>=3.30",
    "openpyxl>=3.1",
    "sqlparse>=0.5",
    "mcp>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bca"]

[project.optional-dependencies]
nlp = ["spacy>=3.7"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "types-jsonschema>=4.26.0.20261006",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = ["slow: deterministic simulator load tests"]
