# Copy this file to site.toml and replace every placeholder locally.
[bigquery]
project = "your-gcp-project"
location = "US"
max_bytes_billed = 53687091200
warn_bytes = 1073741824
reject_bytes = 10737418240
# connector_dir = "~/connectors"
# key_path = "~/credentials/connector.json"
# connector_name = "your_connector_name"
# key_name = "your_connector_key.json"

[recipe]
transcripts_table = "your_dataset.your_transcripts_view"
calls_table = "your_dataset.your_calls_view"
lead_id_column = "lead_id"
call_id_column = "call_id"
transcript_text_column = "transcript_text"
call_start_column = "call_start"
call_duration_column = "call_duration"
advisor_column = "advisor_name"
transcript_status_column = "transcript_status"
duration_unit = "ms"
max_chars_per_lead = 400000
drop_calls_shorter_than_s = 180
speaker_labels = { learner = ["Customer", "Lead", "Learner"], advisor = ["Agent", "Advisor", "PA"] }

[models]
claude_model = "claude-opus-5-5"
claude_effort = "high"
luna_model = "gpt-5.6-luna"
luna_effort = "high"

[limits]
codex_stop_percent = 95
claude_turn_max_turns = 25
lead_timeout_s = 1800
lead_max_attempts = 2

[retention]
masked_cache_days = 30
chat_days = 90

[masking]
# roster_file = "~/private/roster.txt"
