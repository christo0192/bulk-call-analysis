[package]
name = "bulk-call-analysis"
version = "0.1.0"
description = "Bulk Call Analysis desktop shell"
authors = ["Bulk Call Analysis contributors"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[lib]
name = "bulk_call_analysis_lib"
crate-type = ["lib", "staticlib"]

[dependencies]
log = "0.4.22"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["io-util", "process", "sync", "time"] }
tauri = { version = "2.1.1", features = ["tray-icon"] }
tauri-plugin-autostart = "2.2.0"
tauri-plugin-single-instance = "2.2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Power", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.169"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.0"
objc2 = "0.5.2"
block2 = "0.5.1"
objc2-foundation = { version = "0.2.2", features = ["NSProcessInfo", "NSString", "NSObject", "NSNotification", "NSOperation", "NSRunLoop", "block2"] }
objc2-app-kit = { version = "0.2.0", features = ["NSWorkspace", "block2"] }

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }
